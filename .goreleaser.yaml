# GoReleaser configuration for Agent Ledger
# https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy
    - cd ui/frontend && npm ci && npm run build && node -e "require('fs').mkdirSync('../dist',{recursive:true}); require('fs').writeFileSync('../dist/.gitkeep','')"

builds:
  - id: agent-ledger
    main: ./cmd/ledger
    binary: agent-ledger
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: default
    name_template: "agent-ledger_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    builds:
      - agent-ledger
    files:
      - none*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
