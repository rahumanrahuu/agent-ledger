name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "ui/frontend/package.json"

      - name: Build frontend
        run: |
          cd ui/frontend
          npm install
          npm run build

      - name: Run test suite
        run: go test -v ./...

      - name: Verify tag is on main
        run: |
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          TAG_SHA=$(git rev-parse HEAD)
          if [ "$MAIN_SHA" != "$TAG_SHA" ]; then
            echo "Error: Tag $GITHUB_REF_NAME does not point to origin/main."
            echo "Releases must be built from the main branch."
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
